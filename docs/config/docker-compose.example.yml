# Execute com `podman compose`, nunca com Docker.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: redai
      POSTGRES_USER: redai
      POSTGRES_PASSWORD: redai_dev
    ports:
      - "5432:5432"
    volumes:
      - redai-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "5080:8080"
    volumes:
      - redai-assets:/data/assets
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5080/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  redai-postgres:
  redai-assets:
